# Local PostgreSQL stack, closer to production than the SQLite default.
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://fleet_user:fleet_password@db:5432/fleet
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-me}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fleet_pgdata:
